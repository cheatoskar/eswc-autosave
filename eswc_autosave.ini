; eswc_autosave: saves the replay after each finish of the local player.
; LAN/NC: the previous race, like Esc -> "Save previous replay".
; Solo:   the race replay, like "Save replay" on the end-race screen.
; Both without the Save-As and "Replay Saved" dialogs.
[autosave]
; 1 = on, 0 = off
Enabled=1
; all  = after every finish
; best = only when the finish is a new personal best on this map (this session)
Mode=best
; Virtual key code that saves the previous/last replay right now (0x78 = F9). 0 = off.
TestKey=0x78
; 1 = refresh the game's replay list after saving, as the game does after a manual save.
ScanReplays=1
; 1 = after a LAN/online save of a replay with several ghosts (you + other players + server),
;     also write "<same name> TMX.Replay.Gbx" with only your ghost and your inputs, so the
;     header says validable="1" (TM-Exchange). Runs in a background thread after the save.
; 0 = off.
TmxCopy=1

[online]
; 1 = let the game's HTTPS login reach game.trackmanianations.com again (error 12157):
;     allow TLS 1.0 for WinINet in this process only, skip the certificate revocation check.
; 0 = leave online as it is.
OnlineFix=1
