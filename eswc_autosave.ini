; Legacy Essentials (eswc_autosave.dll) for TrackMania Nations ESWC, Sunrise and Original.
; The in-game menu (Ctrl+F2) changes Enabled, Mode, ControllerFix and OnlineFix and writes them here.
;
; Autosave: saves the replay after each finish of the local player.
; ESWC LAN/NC: the previous race, like Esc -> "Save previous replay".
; Solo (ESWC, Sunrise, Original): the race replay, like "Save replay" on the end-race screen.
; Without the Save-As and "Replay Saved" dialogs. Sunrise and Original: solo only.
[autosave]
; 1 = on, 0 = off
Enabled=1
; all  = after every finish
; best = only when the finish is a new personal best on this map (this session)
Mode=best
; Virtual key code that saves the previous/last replay right now (0x78 = F9). 0 = off.
TestKey=0x78
; 1 = refresh the game's replay list after saving, as the game does after a manual save.
ScanReplays=1
; ESWC only: 1 = after a LAN/online save with other players in the replay, also write
;     "<name> TMX.Replay.Gbx" with only your own ghost, so TM-Exchange accepts it. 0 = off.
TmxCopy=1

[online]
; ESWC and Original: 1 = let the game's HTTPS login work again (error 12157):
;     allow TLS 1.0 for WinINet in this process only, skip the certificate revocation check.
; 0 = leave online as it is. Sunrise: not used. A change takes effect at the next game start.
OnlineFix=1

[controller]
; 1 = a controller plugged in or switched on while the game runs is added at once, with the game's
;     own bindings for it (the saved ones, or the game's defaults). 0 = off.
ControllerFix=1

[menu]
; Key that opens the menu: e.g. Ctrl+F2, Shift+F11, Insert, 0x71. 0 = no menu.
MenuKey=Ctrl+F2
